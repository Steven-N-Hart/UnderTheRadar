name: Create Release
on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui pystray Pillow cx_Freeze
      - name: Build MSI
        run: python setup_msi.py bdist_msi
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: UnderTheRadar-Windows
          path: dist/*.msi

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui pystray Pillow pyinstaller
      - name: Build App Bundle
        run: |
          pyinstaller --noconsole --onefile --windowed --icon=assets/radar.icns -n "UnderTheRadar" UnderTheRadar.py
      - name: Create DMG
        run: |
          # Use hdiutil (native Mac tool) to create a basic DMG
          hdiutil create -volname "UnderTheRadar" -srcfolder dist/UnderTheRadar.app -ov -format UDZO UnderTheRadar.dmg
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: UnderTheRadar-Mac
          path: UnderTheRadar.dmg

  create-release:
      needs: [build-windows, build-mac]
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v4

        - name: Download Windows MSI
          uses: actions/download-artifact@v4
          with:
            name: UnderTheRadar-Windows
            path: ./release-assets

        - name: Download Mac DMG
          uses: actions/download-artifact@v4
          with:
            name: UnderTheRadar-Mac
            path: ./release-assets

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            files: |
              release-assets/*.msi
              release-assets/*.dmg
            body_path: README.md
            draft: false
            prerelease: false
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}